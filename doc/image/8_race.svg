<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400" font-family="sans-serif" font-size="14">
<rect width="780" height="400" fill="#ffffff"/>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
</defs>

<text x="195" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">j &gt; i : fc[i] と fc[j] の両方を更新</text>
<text x="585" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">フルペア : 自分の fc[i] だけを更新</text>
<line x1="390" y1="50" x2="390" y2="380" stroke="#999" stroke-width="1" stroke-dasharray="4 4"/>

<!-- left -->
<rect x="20" y="80" width="130" height="50" fill="#e8f0fe" stroke="#333" stroke-width="1.5"/>
<text x="85" y="102" text-anchor="middle" fill="#000">スレッド A</text>
<text x="85" y="120" text-anchor="middle" fill="#000">粒子 i = 3 の担当</text>
<rect x="20" y="250" width="130" height="50" fill="#e8f0fe" stroke="#333" stroke-width="1.5"/>
<text x="85" y="272" text-anchor="middle" fill="#000">スレッド B</text>
<text x="85" y="290" text-anchor="middle" fill="#000">粒子 i = 7 の担当</text>
<rect x="270" y="165" width="100" height="50" fill="#fde0dc" stroke="#c0392b" stroke-width="2"/>
<text x="320" y="196" text-anchor="middle" font-size="16" fill="#000">fc[9]</text>
<line x1="150" y1="115" x2="266" y2="180" stroke="#c0392b" stroke-width="2" marker-end="url(#arr)"/>
<line x1="150" y1="265" x2="266" y2="200" stroke="#c0392b" stroke-width="2" marker-end="url(#arr)"/>
<text x="215" y="125" font-size="12" fill="#000">組 (3, 9)</text>
<text x="215" y="278" font-size="12" fill="#000">組 (7, 9)</text>
<text x="195" y="345" text-anchor="middle" fill="#c0392b" font-weight="bold">同時に書き込む = データ競合</text>
<text x="195" y="367" text-anchor="middle" font-size="12" fill="#000">片方の更新が消えることがある</text>

<!-- right -->
<rect x="410" y="80" width="130" height="50" fill="#e8f0fe" stroke="#333" stroke-width="1.5"/>
<text x="475" y="102" text-anchor="middle" fill="#000">スレッド A</text>
<text x="475" y="120" text-anchor="middle" fill="#000">粒子 i = 3 の担当</text>
<rect x="410" y="250" width="130" height="50" fill="#e8f0fe" stroke="#333" stroke-width="1.5"/>
<text x="475" y="272" text-anchor="middle" fill="#000">スレッド B</text>
<text x="475" y="290" text-anchor="middle" fill="#000">粒子 i = 7 の担当</text>
<rect x="660" y="80" width="100" height="50" fill="#e3f4e1" stroke="#2e7d32" stroke-width="2"/>
<text x="710" y="111" text-anchor="middle" font-size="16" fill="#000">fc[3]</text>
<rect x="660" y="250" width="100" height="50" fill="#e3f4e1" stroke="#2e7d32" stroke-width="2"/>
<text x="710" y="281" text-anchor="middle" font-size="16" fill="#000">fc[7]</text>
<line x1="540" y1="105" x2="656" y2="105" stroke="#2e7d32" stroke-width="2" marker-end="url(#ar)"/>
<line x1="540" y1="275" x2="656" y2="275" stroke="#2e7d32" stroke-width="2" marker-end="url(#ar)"/>
<text x="598" y="97" text-anchor="middle" font-size="12" fill="#000">j = 0, 1, 2, ...</text>
<text x="598" y="267" text-anchor="middle" font-size="12" fill="#000">j = 0, 1, 2, ...</text>
<text x="585" y="345" text-anchor="middle" fill="#2e7d32" font-weight="bold">書き込み先が重ならない = 競合なし</text>
<text x="585" y="367" text-anchor="middle" font-size="12" fill="#000">計算する組は2倍になる (3,9 と 9,3 の両方)</text>
</svg>
